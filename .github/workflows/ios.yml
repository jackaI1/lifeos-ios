name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run package XCTest suite
        run: swift test --jobs 2
      - name: Read public feed and verify offline relaunch
        env:
          FEED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: swift run --jobs 2 LifeOSDemoCheck "https://raw.githubusercontent.com/jackaI1/lifeos-ios/$FEED_COMMIT/demo-api/today.json"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS XCTest and build the app
        run: scripts/ci-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-screen
          path: Companion.png
          if-no-files-found: ignore
